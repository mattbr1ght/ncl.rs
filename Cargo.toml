[package]
name = "ncl"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.48", features = ["cargo", "derive"] }
cliclack = "0.3.6"
console = "0.16.1"
dirs-next = "2.0.0"
git2 = "0.20.2"
grep = "0.4.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.15"
include_dir = "0.7.4"
keyring = "3.6.3"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
terminal_size = "0.4.3"
toml = "0.9.8"
walkdir = "2.5.0"
which = "8.0.0"
whoami = "1.6.1"
