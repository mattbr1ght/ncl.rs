name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Rust Marker Linter
      # You may pin to the exact commit or the version.
      # uses: rust-marker/marker@8148ed377bba7b873b791915dc271c75fd5b828e
      uses: rust-marker/marker@v0.4.3
      with:
        # If set to `true` then the action will only install `cargo marker`, and will skip running `cargo marker`. Use this if you want to run something more complex than just `cargo marker`. If you think there may be a frequent use case for running a different command then we will be glad if you open a feature request issue for that to extend the action input parameters.
        install-only: false # optional, default is false
    # - name: rust-rustfmt-check
    #   # You may pin to the exact commit or the version.
    #   # uses: mbrobbel/rustfmt-check@9a22c8ce35fa788e7db3bfb4c814ad1c13b4d5be
    #   uses: mbrobbel/rustfmt-check@0.20.0
    #   with:
    #     # GitHub token
    #     token: 
    #     # Arguments for cargo.
    #     args: # optional
    #     # Arguments for rustfmt.
    #     rustfmt-args: # optional
    #     # Output mode (commit, review or pull)
    #     mode: # optional, default is commit
    #     # Commit message for formatting commits.
    #     commit-message: # optional, default is Format Rust code using rustfmt
          
