name = "React Native (Expo)"
comment = "Base scaffold for React Native projects"
version = "1.0.0"

post_install_hook = [
    "docker compose up -d --build",
]

[hooks]
dev = ["docker compose up -d"]
stop = ["docker compose down"]

[[dependencies]]
name = "node"
check = "node --version"
install_hint = "https://nodejs.org/en/download/"

[[dependencies]]
name = "git"
check = "git --version"
install_hint = "https://git-scm.com/downloads"

[[dependencies]]
name = "npm"
check = "npm --version"
install_hint = "Installed with node.js"
