name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
      - prod
  push:
    branches:
      - dev
      - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' && 'production' || github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'development' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint script found"

      - name: Typecheck
        run: npm run typecheck || npx tsc --noEmit || echo "No typecheck configured"

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test || echo "No tests configured"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Fast)
        run: npm test || echo "No tests configured"