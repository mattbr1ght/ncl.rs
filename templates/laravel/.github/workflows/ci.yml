name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
      - prod
  push:
    branches:
      - dev
      - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' && 'production' || github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'development' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env || true

      - name: Generate Application Key
        run: php artisan key:generate || true

      - name: Lint
        run: npm run lint || vendor/bin/pint --test || echo "No lint configured"

      - name: Format Frontend
        run: npm run format || echo "No format script found"

      - name: Typecheck
        run: npm run typecheck || npx tsc --noEmit || echo "No typecheck configured"

      - name: Build Assets
        run: npm run build || echo "No build script found"

      - name: Run Tests
        run: ./vendor/bin/pest || echo "No tests configured"

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-latest
          secrets: |
            "username=${{ secrets.REGISTRY_USER }}"
            "password=${{ secrets.REGISTRY_TOKEN }}"

      - name: Deploy to Coolify (Dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_DEV }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"branch": "dev"}'
          else
            echo "COOLIFY_WEBHOOK_DEV not configured, skipping deployment"
          fi

  deploy-prod:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Tests (Fast)
        run: ./vendor/bin/pest --parallel || echo "No tests configured"

      - name: Deploy to Coolify (Prod)
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_PROD }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"branch": "prod"}'
          else
            echo "COOLIFY_WEBHOOK_PROD not configured, skipping deployment"
          fi

