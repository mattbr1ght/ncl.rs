name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
      - prod
  push:
    branches:
      - prod

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env || true

      - name: Generate Application Key
        run: php artisan key:generate || true

      - name: Lint
        run: npm run lint || vendor/bin/pint --test || echo "No lint configured"

      - name: Format Frontend
        run: npm run format

      - name: Typecheck
        run: npm run typecheck || npx tsc --noEmit || echo "No typecheck configured"

      - name: Build Assets
        run: npm run build || echo "No build script found"

      - name: Run Tests
        run: ./vendor/bin/pest || echo "No tests configured"

      - name: Deploy to Coolify (Dev)
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROJECT_ID: ${{ secrets.COOLIFY_PROJECT_ID }}
        run: |
          curl -X POST "$COOLIFY_URL/api/v1/projects/$COOLIFY_PROJECT_ID/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"branch": "dev", "environment": "dev"}'

      - name: Deploy to Coolify (Prod)
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROJECT_ID: ${{ secrets.COOLIFY_PROJECT_ID }}
        run: |
          curl -X POST "$COOLIFY_URL/api/v1/projects/$COOLIFY_PROJECT_ID/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"branch": "prod", "environment": "prod"}'

